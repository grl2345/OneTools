<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafbfc" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Defaults (react-helmet-async overrides per route) -->
    <title>OneTools — Developer Tools</title>
    <meta
      name="description"
      content="Privacy-first developer tools: JSON, Markdown, timestamp, image compression, AI background / watermark removal — all runs in your browser."
    />
    <meta property="og:site_name" content="OneTools" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OneTools — Developer Tools" />
    <meta
      property="og:description"
      content="Privacy-first developer tools that run 100% in your browser."
    />
    <meta property="og:image" content="https://onetools.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://onetools.dev/og-image.png" />

    <!-- Fonts: load async to avoid blocking LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- Google tag (gtag.js) — defer to keep main thread free for hydration -->
    <script defer src="https://www.googletagmanager.com/gtag/js?id=G-DX53WR0QVV"></script>
    <script>
      window.addEventListener('load', function () {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-DX53WR0QVV');
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
